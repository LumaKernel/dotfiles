[window]
option_as_alt = "Both"
decorations = "None"

[font]
normal = { family = "UDEV Gothic 35HS", style = "Regular" }

# https://github.com/toml-lang/toml/issues/657
[[keyboard.bindings]]
key = "Slash"
mods = "Control"
chars = "\u001f"

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "open"
hyperlinks = true
post_processing = true
persist = false
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|nntp:|sftp:|ssh:|telnet://|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true
mods = "Command"
