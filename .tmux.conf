
# NOTE : man tmux
#   - KEY BINDINGS でデフォルトのキーバインドが見れる

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'haru-ake/tmux-pet'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set -g @pet-new-pane-key 'C-f'

# set -g @plugin 'tmux-plugins/tmux-resurrect'

set-option -g prefix C-k
unbind-key C-b
unbind-key d
bind-key C-k send-prefix

set-option -ga update-environment RUN_VIM

set-option -sg escape-time 0

set-option -g status on
set-option -g status-interval 2
set-option -g status-justify "left"
set-option -g status-left-length 60
set-option -g status-right-length 90
set-option -g status-left ""
set-option -g status-right "#(~/bin/tmux-powerline/powerline.sh right)"
# TODO どうにかする
set-window-option -g window-status-separator ""
set-window-option -g window-status-current-format "#[fg=colour255, bg=colour27] #I #W #[fg=colour27, bg=colour251]| #[fg=colour27, bg=colour251]"
set-window-option -g window-status-format "#[fg=colour233, bg=colour251] #I #W #[fg=colour233, bg=colour251]| #[fg=colour27, bg=colour251]"

set-option -g status-fg white
set-option -g status-bg black

set-option -g base-index 1
set-window-option -g pane-base-index 1

bind-key r source-file ~/.tmux.conf \; display "tmux configuration reloaded."

bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key ¥ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
bind-key -n M-¥ split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"

bind-key c new-window -c "#{pane_current_path}"

bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R
bind-key -n M-J select-pane -D
bind-key -n M-K select-pane -U
bind-key -n M-H select-pane -L
bind-key -n M-L select-pane -R
bind-key -n M-j run 'bash ~/dotfiles/tmux/vim-tmux-move.sh j'
bind-key -n M-k run 'bash ~/dotfiles/tmux/vim-tmux-move.sh k'
bind-key -n M-h run 'bash ~/dotfiles/tmux/vim-tmux-move.sh h'
bind-key -n M-l run 'bash ~/dotfiles/tmux/vim-tmux-move.sh l'
bind-key -n Ô select-pane -D
bind-key -n  select-pane -U
bind-key -n Ó select-pane -L
bind-key -n Ò select-pane -R
bind-key -n ∆ run 'bash ~/dotfiles/tmux/vim-tmux-move.sh j'
bind-key -n ˚ run 'bash ~/dotfiles/tmux/vim-tmux-move.sh k'
bind-key -n ˙ run 'bash ~/dotfiles/tmux/vim-tmux-move.sh h'
bind-key -n ¬ run 'bash ~/dotfiles/tmux/vim-tmux-move.sh l'

bind-key -n ¥ send-keys \\

bind-key n select-window -t:+
bind-key p select-window -t:-
bind-key -n M-n select-window -t:+
bind-key -n M-p select-window -t:-
# bind-key -n ˜ select-window -t:+
# bind-key -n π select-window -t:-

bind-key -n M-C-h resize-pane -L 3
bind-key -n M-C-j resize-pane -D 3
bind-key -n M-C-k  resize-pane -U 3
bind-key -n M-C-l  resize-pane -R 3
bind-key H resize-pane -L 7
bind-key J resize-pane -D 7
bind-key K resize-pane -U 7
bind-key L resize-pane -R 7

bind-key -n M-C-n swap-window -t +1 \; select-window -t:+
bind-key -n M-C-p swap-window -t -1 \; select-window -t:-

set-window-option -g mode-key vi
set-option -g status-keys emacs

set-option -g default-terminal "screen-256color"

# set-window-option -g window-status-current-fg white
# set-window-option -g window-status-current-bg red
# set-window-option -g window-status-current-attr bright

# set-option -g pane-active-border-fg white
# set-option -g pane-active-border-bg yellow

bind-key -T copy-mode-vi v send-keys -X begin-selection

# if-shell 'test "$(uname -a | grep microsoft)" != ""' 'bind-key -T copy-mode-vi Enter copy-pipe "cat | clip.exe"'
if-shell 'test "$(uname -a | grep microsoft)" != ""' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "cat | win32yank.exe -i"'

set -g @plugin 'unsafe9/claude-tmux-hop'

# claude-tmux-hop keybindings
# hop cycle: M-Space (no prefix, raw bind added after TPM loads)
set -g @hop-cycle-key 'None'
# back key: plugin binds -n (no prefix), so disable and use raw prefix bind after TPM
set -g @hop-back-key 'None'
set -g @hop-picker-key 'f'
set -g @hop-inbox-key 'i'
set -g @hop-conductor-key 'y'
set -g @hop-conductor-respawn-key 'Y'

# claude-tmux-hop options
set -g @hop-cycle-mode 'priority'
set -g @hop-notify 'waiting'
set -g @hop-window-rename 'on'
set -g @hop-inbox-preview 'on'

run -b '~/.tmux/plugins/tpm/tpm'

# M-Space: hop cycle (no prefix) - must be after TPM loads
bind-key -n M-Space run-shell "~/.tmux/plugins/claude-tmux-hop/bin/claude-tmux-hop cycle --pane '#{pane_id}' --mode 'priority'"
# prefix + o: hop back (prefix-bound, plugin hardcodes -n so we bind manually)
bind-key o run-shell "~/.tmux/plugins/claude-tmux-hop/bin/claude-tmux-hop back"
# <prefix>I  : install
# <prefix>U  : update

# agent-deck configuration
# agent-deck-tmux-config-version: 4
# Added by agent-deck installer - 2026-09-04
# https://github.com/asheshgoplani/agent-deck

# Terminal with true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"

# Performance
set -sg escape-time 0
set -g history-limit 50000

# Extended keys: forward Shift+Enter and other modified keys to apps (tmux 3.2+)
set -s extended-keys on
# Deliver them as ESC[13;2u (the kitty keyboard-protocol form Claude Code reads)
# rather than xterm modifyOtherKeys ESC[27;2;13~, which Claude Code ignores.
set -s extended-keys-format csi-u
set -as terminal-features 'tmux-256color:extkeys'

# Mouse support (scroll + drag-to-copy)
set -g mouse on

# Auto-enter copy-mode when scrolling up (critical for WSL compatibility)
# This handles: 1) apps with mouse support, 2) already in copy-mode, 3) normal pane
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Scroll bindings in copy-mode (both vi and emacs modes)
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Clipboard integration (drag-to-copy)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# End agent-deck configuration

